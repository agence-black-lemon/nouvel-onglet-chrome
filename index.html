<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,400;125,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --fg:#fff; --muted:#8a8a8a; --line:#1f1f1f; --tile:#0d0d0d; --tile-h:#171717; --red:#FF0000;
    --display:"Monument Extended","Archivo",system-ui,sans-serif;
    --text:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:14px;
       -webkit-font-smoothing:antialiased;padding:40px 48px;min-height:100vh}
  a{color:inherit;text-decoration:none}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:36px}
  .brand{display:flex;align-items:center;gap:22px}
  .logo{width:clamp(56px,6vw,84px);height:auto;flex:none}
  .hello{font-family:var(--display);font-weight:800;font-stretch:125%;font-size:clamp(28px,4vw,52px);
         line-height:1;letter-spacing:-.01em;text-transform:uppercase}
  .hello .dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--red);
              margin-left:.08em;vertical-align:baseline}
  .date{color:var(--muted);margin-top:10px;font-size:15px}
  .clock{font-family:var(--display);font-stretch:125%;font-size:clamp(22px,2.6vw,34px);font-variant-numeric:tabular-nums}

  form.search{margin-bottom:40px}
  form.search input{width:100%;background:var(--tile);border:1px solid var(--line);color:var(--fg);
       font:inherit;font-size:16px;padding:16px 20px;border-radius:999px;outline:none}
  form.search input:focus{border-color:#444}

  main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:start}
  h2{font-family:var(--display);font-stretch:125%;font-weight:400;font-size:11px;letter-spacing:.14em;
     text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .group{margin-bottom:28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tool{display:flex;align-items:center;gap:12px;background:var(--tile);border:1px solid var(--line);
        border-radius:14px;padding:14px;transition:background .15s,border-color .15s}
  .tool:hover{background:var(--tile-h);border-color:#333}
  .tool:hover .name::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
        background:var(--red);margin-left:8px;vertical-align:middle}
  .ico{width:32px;height:32px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
  .ico img{width:20px;height:20px}
  .ico img.plein{width:100%;height:100%;object-fit:cover}
  .ico span{color:#000;font-family:var(--display);font-weight:800;font-size:13px}
  .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  aside{position:sticky;top:24px}
  .cal{background:#fff;border-radius:16px;overflow:hidden;height:calc(100vh - 220px);min-height:420px}
  .cal iframe{border:0;width:100%;height:100%}
  .cal-setup{background:var(--tile);border:1px solid var(--line);border-radius:16px;padding:24px}
  .cal-setup p{color:var(--muted);margin-bottom:14px;line-height:1.5}
  .cal-setup input{width:100%;background:#000;border:1px solid #333;color:#fff;font:inherit;padding:12px 14px;border-radius:10px;margin-bottom:10px}
  .btn{background:var(--fg);color:#000;border:0;font:inherit;font-weight:500;padding:11px 16px;border-radius:10px;cursor:pointer}
  .cal-tools{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:12px}
  .cal-tools button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline}

  footer{margin-top:24px;color:#444;font-size:12px}
  .ticket-cta{display:flex;align-items:center;gap:14px;width:100%;max-width:420px;text-align:left;cursor:pointer;
       background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--fg);font:inherit}
  .ticket-cta:hover{background:var(--tile-h);border-color:var(--red)}
  .ticket-cta .sub{color:var(--muted);font-size:13px}
  .ticket-ico{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;
       font-family:var(--display);font-weight:800;flex:none}
  dialog#ticket{margin:auto;width:min(520px,calc(100% - 32px));background:#0d0d0d;color:var(--fg);border:1px solid #2a2a2a;
       border-radius:18px;padding:24px}
  dialog#ticket::backdrop{background:rgba(0,0,0,.7)}
  .t-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .t-head h3{font-family:var(--display);font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:18px}
  .t-close{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  #ticketForm label{display:block;color:var(--muted);font-size:12px;margin-bottom:12px}
  #ticketForm .opt{color:#555}
  #ticketForm select,#ticketForm input,#ticketForm textarea{display:block;width:100%;margin-top:6px;background:#000;color:#fff;
       border:1px solid #333;border-radius:10px;padding:11px 12px;font:inherit;font-size:14px;resize:vertical}
  #ticketForm select:focus,#ticketForm input:focus,#ticketForm textarea:focus{outline:none;border-color:#666}
  .t-note{color:var(--muted);font-size:12px;line-height:1.5;margin:4px 0 14px}
  .annonce{margin:-20px 0 36px;padding:14px 20px;border-left:3px solid var(--red);background:var(--tile);
           border-radius:0 12px 12px 0;line-height:1.5;white-space:pre-line}

  @media (max-width:1000px){
    body{padding:24px 16px}
    main{grid-template-columns:1fr}
    aside{position:static}
    .cal{height:520px}
    header{flex-direction:column;align-items:flex-start}
  }
</style>
</head>

  </svg>
  <div>
    <div class="hello" id="hello">Bonjour<span class="dot"></span></div>
    <div class="date" id="date"></div>
  </div>
  </div>
  <div class="clock" id="clock"></div>
</header>

<form class="search" action="https://www.google.com/search" method="get">
  <input name="q" placeholder="Rechercher sur Google…" autocomplete="off" autofocus>
</form>

<main>
  <section>
    <div id="tools"></div>
    <div class="group">
      <h2>Support IT</h2>
      <button class="ticket-cta" id="ticketOpen" type="button">
        <span class="ticket-ico">!</span>
        <span><strong>Un problème avec ton ordi ?</strong><br><span class="sub">Le tunnel avec l'IT c'est par ici</span></span>
      </button>
    </div>
  </section>
  <aside>
    <h2>Mon agenda</h2>
    <div id="calendar"></div>
  </aside>
</main>

<footer>Un lien manque ou ne marche plus ? Écris à Florian sur Slack.</footer>

<dialog id="ticket">
  <form id="ticketForm" method="dialog">
    <div class="t-head">
      <h3>Ticket support IT</h3>
      <button type="button" class="t-close" id="ticketClose" aria-label="Fermer">×</button>
    </div>
    <label>Type de problème
      <select id="tType" required>
        <option value="">Choisir…</option>
        <option>Ordinateur (lenteur, plantage, démarrage)</option>
        <option>Internet / Wi-Fi</option>
        <option>Imprimante</option>
        <option>Messagerie / compte Google</option>
        <option>Le Commun (serveur, fichiers partagés)</option>
        <option>Logiciel / installation</option>
        <option>Autre</option>
      </select>
    </label>
    <label>Urgence
      <select id="tUrg">
        <option value="Normale">Normale — je peux continuer à travailler</option>
        <option value="Haute">Haute — je suis gêné·e dans mon travail</option>
        <option value="Bloquante">Bloquante — je ne peux plus travailler</option>
      </select>
    </label>
    <label>Résumé en quelques mots
      <input id="tSujet" required maxlength="80" placeholder="ex. Le Wi-Fi coupe toutes les 10 min">
    </label>
    <label>Description
      <textarea id="tDesc" required rows="5" placeholder="Que se passe-t-il ? Depuis quand ? Un message d'erreur ? Qu'as-tu déjà essayé ?"></textarea>
    </label>
    <label>Appareil concerné <span class="opt">(facultatif)</span>
      <input id="tPoste" placeholder="ex. MacBook Air de Florian, imprimante de l'entrée">
    </label>
    <p class="t-note">Le mail s'ouvre dans Gmail, prêt à envoyer. Tu peux y joindre une capture d'écran avant d'envoyer.</p>
    <button class="btn" type="submit">Préparer le mail</button>
  </form>
</dialog>

/* ============ Rien à modifier en dessous ============ */
const $ = s => document.querySelector(s);

// Stockage local protégé (peut être indisponible en navigation privée)
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};

// En-tête : salutation, date, heure
// Prénom = partie avant le "." de l'adresse (ex. jean-marc.dupont@ → Jean-Marc)
function prenom(){
  const email = store.get("bl_agenda_email");
  if(!email) return "";
  const brut = email.split("@")[0].split(".")[0];
  return brut.replace(/[^a-zà-ÿ-]/gi, "")
             .split("-").map(s => s.charAt(0).toUpperCase() + s.slice(1)).join("-");
}

// Bandeau message
if(MESSAGE.trim()){
  const b = document.createElement("div");
  b.className = "annonce";
  b.textContent = MESSAGE;
  document.querySelector("form.search").after(b);
}

function tick(){
  const d = new Date();
  const h = d.getHours();
  const p = prenom();
  $("#hello").innerHTML = (h < 18 ? "Bonjour" : "Bonsoir") + (p ? " " + p : "") + '<span class="dot"></span>';
  $("#date").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  $("#clock").textContent = d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
tick(); setInterval(tick, 10000);

// Tuiles des outils
function domaineDe(url){ try { return new URL(url).hostname; } catch(e){ return ""; } }
$("#tools").innerHTML = OUTILS.map(g => `
  <div class="group">
    <h2>${g.groupe}</h2>
    <div class="grid">
      ${g.liens.map(l => {
        const host = domaineDe(l.url);
        const ico = l.icone
          ? `<img src="${l.icone}" alt=""${l.plein ? ' class="plein"' : ""}>`
          : host
          ? `<img src="https://www.google.com/s2/favicons?domain=${host}&sz=64" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${l.nom[0]}'}))">`
          : `<span>${l.nom[0]}</span>`;
        return `<a class="tool" href="${l.url}"><div class="ico">${ico}</div><div class="name">${l.nom}</div></a>`;
      }).join("")}
    </div>
  </div>`).join("");

// Agenda : chaque personne renseigne son adresse une fois, elle est gardée dans son navigateur
function afficherAgenda(){
  const email = store.get("bl_agenda_email");
  const box = $("#calendar");
  if(!email){
    box.innerHTML = `
      <div class="cal-setup">
        <p>Pour afficher ton agenda ici, indique ton adresse Black Lemon (à faire une seule fois).</p>
        <form id="calForm">
          <input id="calEmail" type="email" placeholder="prenom.nom@${DOMAINE}" required>
          <button class="btn" type="submit">Afficher mon agenda</button>
        </form>
      </div>`;
    $("#calForm").addEventListener("submit", e => {
      e.preventDefault();
      store.set("bl_agenda_email", $("#calEmail").value.trim().toLowerCase());
      afficherAgenda(); tick();
    });
    return;
  }
  const params = new URLSearchParams({
    src: email, ctz: "Europe/Paris", hl: "fr", wkst: "2",
    mode: store.get("bl_agenda_mode") || "AGENDA",
    showTitle: "0", showPrint: "0", showTabs: "0", showCalendars: "0", showTz: "0",
  });
  const mode = params.get("mode");
  box.innerHTML = `
    <div class="cal"><iframe src="https://calendar.google.com/calendar/embed?${params}" loading="lazy"></iframe></div>
    <div class="cal-tools">
      <button id="calMode">${mode === "AGENDA" ? "Vue semaine" : "Vue liste"}</button>
      <button id="calReset">Changer d'adresse</button>
    </div>`;
  $("#calMode").onclick = () => { store.set("bl_agenda_mode", mode === "AGENDA" ? "WEEK" : "AGENDA"); afficherAgenda(); };
  $("#calReset").onclick = () => { store.del("bl_agenda_email"); afficherAgenda(); tick(); };
}
afficherAgenda();

// Ticket support : ouvre un brouillon Gmail pré-rempli
const dlg = $("#ticket");
$("#ticketOpen").onclick = () => dlg.showModal();
$("#ticketClose").onclick = () => dlg.close();
$("#ticketForm").addEventListener("submit", e => {
  e.preventDefault();
  const email = store.get("bl_agenda_email") || "";
  const p = prenom();
  const urg = $("#tUrg").value;
  const sujet = `[Black Lemon] ${urg === "Normale" ? "" : urg.toUpperCase() + " – "}${$("#tSujet").value.trim()}`;
  const corps = [
    "Bonjour,", "",
    "Je vous sollicite pour la demande de support suivante :", "",
    `Demandeur : ${p || "—"}${email ? " (" + email + ")" : ""}`,
    `Type de problème : ${$("#tType").value}`,
    `Urgence : ${urg}`,
    `Appareil concerné : ${$("#tPoste").value.trim() || "—"}`, "",
    "Description :", $("#tDesc").value.trim(), "",
    "Merci d'avance,", p || "",
  ].join("\n");
  const url = "https://mail.google.com/mail/?view=cm&fs=1"
    + "&to=" + encodeURIComponent(SUPPORT_EMAIL)
    + "&su=" + encodeURIComponent(sujet)
    + "&body=" + encodeURIComponent(corps);
  window.open(url, "_blank");
  e.target.reset();
  dlg.close();
});
</script>
